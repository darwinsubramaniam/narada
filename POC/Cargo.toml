# Standalone workspace — intentionally NOT part of the narada Dioxus workspace
# (the root Cargo.toml excludes this path). Keeps the heavy subxt dependency
# tree fully separate from the app.
[workspace]

[package]
name = "narada-poc"
version = "0.1.0"
edition = "2021"
description = "POC: decentralize Polkadot multisig call-data sync via the Bulletin Chain"

[dependencies]
subxt = "0.50.0"
subxt-signer = "0.50.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
hex = "0.4"
# BLAKE2b-256 == substrate `blake2_256` == Bulletin content hash. Used for the
# multisig account derivation, the call hash, and the retrieval integrity check.
blake2 = "0.10"
# Reconstruct the IPFS CIDv1 (raw 0x55 + blake2b-256 0xb220 multihash) from the
# on-chain call hash so the executor can GET the call bytes from the gateway.
cid = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Load signer wallets from the repo-root .wallet.toml (keeps secrets out of CLI/env).
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "narada-poc"
path = "src/main.rs"
